[workspace]
name = "targetcnv-ml"
version = "1.1.0"
description = "Reproducible R 4.6.2 + Bioconductor 3.23 + Quarto 1.10.20 environment for TargetCNV-ML"
authors = ["Diego Andres Benitez Duarte"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tasks]
doctor = "./targetcnv.sh doctor"
restore = "Rscript -e 'renv::restore(prompt = FALSE)'"
unit-tests = "Rscript tests/testthat.R"
test = "./targetcnv.sh test"
train = "./targetcnv.sh train"
transfer = "./targetcnv.sh transfer"

[dependencies]
# Core runtime and report compiler frozen to reference versions
r-base = "==4.6.2"
quarto = "==1.10.20"
r-renv = ">=1.2.2"
r-biocmanager = ">=1.30.27"

# System utilities used by targetcnv.sh
curl = "*"
wget = "*"
unzip = "*"

# Bioconductor 3.23 spatial genomics stack
bioconductor-genomicranges = ">=1.64.0,<1.66.0"
bioconductor-rtracklayer = ">=1.72.0,<1.74.0"
bioconductor-s4vectors = ">=0.50.0,<0.52.0"
bioconductor-iranges = ">=2.46.0,<2.48.0"

# CRAN modeling, evaluation, visualization, and testing packages
r-optparse = ">=1.7.5"
r-dplyr = ">=1.2.0"
r-tidyr = ">=1.3.2"
r-stringr = ">=1.6.0"
r-readxl = ">=1.4.5"
r-ggplot2 = ">=4.0.0"
r-cowplot = ">=1.2.0"
r-colorspace = ">=2.1"
r-dt = ">=0.34.0"
r-plotly = ">=4.12.0"
r-knitr = ">=1.51"
r-rmarkdown = ">=2.30"
r-htmltools = ">=0.5.9"
r-jsonlite = ">=2.0.0"
r-caret = ">=7.0"
r-caretensemble = ">=4.0.1"
r-proc = ">=1.19.0"
r-glmnet = ">=4.1"
r-klar = ">=1.7"
r-kernlab = ">=0.9"
r-randomforest = ">=4.7"
r-gbm = ">=2.2"
r-xgboost = ">=3.2.1"
r-rsnns = ">=0.4"
r-deepnet = ">=0.2.1"
r-ipred = ">=0.9"
r-e1071 = ">=1.7"
r-mass = ">=7.3"
r-nnet = ">=7.3"
r-rpart = ">=4.1"
r-rpart.plot = ">=3.1"
r-neuralnettools = ">=1.5"
r-kernelshap = ">=0.9"
r-shapviz = ">=0.10"
r-doparallel = ">=1.0"
r-foreach = ">=1.5"
r-withr = ">=3.0"
r-testthat = ">=3.3.0"

