[workspace]
name = "targetcnv-ml"
version = "1.1.0"
description = "Reproducible R + Bioconductor + Quarto environment for TargetCNV-ML"
authors = ["Diego Andres Benitez Duarte <dabenitezd@unal.edu.co>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[activation.env]
# Evita que .Rprofile active renv sobre la librería gestionada por Pixi
RENV_CONFIG_AUTOLOADER_ENABLED = "FALSE"

[tasks]
setup-cran = "Rscript -e 'extras <- c(\"caretEnsemble\", \"deepnet\", \"kernelshap\", \"shapviz\", \"NeuralNetTools\"); miss <- setdiff(extras, rownames(installed.packages())); if (length(miss) > 0) install.packages(miss, repos = \"https://cloud.r-project.org\")'"
doctor = "./targetcnv.sh doctor"
unit-tests = "Rscript tests/testthat.R"
test = "./targetcnv.sh test"
train = "./targetcnv.sh train"
transfer = "./targetcnv.sh transfer"

[dependencies]
# Intérprete R y Quarto con rangos compatibles con conda-forge
r-base = ">=4.4,<4.7"
quarto = ">=1.5"
r-renv = ">=1.0"
r-biocmanager = ">=1.30"

# Utilidades CLI requeridas por targetcnv.sh
coreutils = "*"
curl = "*"
wget = "*"
unzip = "*"

# Pila Bioconductor de genómica espacial
bioconductor-genomicranges = "*"
bioconductor-rtracklayer = "*"
bioconductor-s4vectors = "*"
bioconductor-iranges = "*"

# Dependencias CRAN disponibles en conda-forge
r-optparse = "*"
r-dplyr = "*"
r-tidyr = "*"
r-stringr = "*"
r-magrittr = "*"
r-rlang = "*"
r-yaml = "*"
r-readxl = "*"
r-ggplot2 = "*"
r-cowplot = "*"
r-colorspace = "*"
r-dt = "*"
r-plotly = "*"
r-knitr = "*"
r-rmarkdown = "*"
r-htmltools = "*"
r-jsonlite = "*"
r-caret = "*"
r-proc = "*"
r-glmnet = "*"
r-klar = "*"
r-kernlab = "*"
r-randomforest = "*"
r-gbm = "*"
r-xgboost = "*"
r-rsnns = "*"
r-ipred = "*"
r-e1071 = "*"
r-mass = "*"
r-nnet = "*"
r-rpart = "*"
r-rpart.plot = "*"
r-doparallel = "*"
r-foreach = "*"
r-withr = "*"
r-testthat = "*"
